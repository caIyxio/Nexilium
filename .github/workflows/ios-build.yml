name: iOS IPA Build

on:
  push:
    branches:
      - main
      - "ui/**"
  pull_request:
  workflow_dispatch:

# Keep only the newest build for a branch; avoid piling up stale IPA builds.
concurrency:
  group: nexilium-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 30
    # The arm64 macOS hosted pool has been failing to provision runners.
    # Use the Intel pool as a temporary workaround.
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Normalize app icon dimensions
        run: sips -z 1024 1024 Nexilium/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Resolve Swift packages
        timeout-minutes: 10
        run: xcodebuild -resolvePackageDependencies -project Nexilium.xcodeproj -scheme Nexilium

      - name: Build for generic iOS device
        timeout-minutes: 20
        run: |
          xcodebuild \
            -project Nexilium.xcodeproj \
            -scheme Nexilium \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Debug-iphoneos/Nexilium.app package/Payload/
          cd package
          zip -r ../Nexilium-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexilium-unsigned-IPA
          path: Nexilium-unsigned.ipa
          if-no-files-found: error
