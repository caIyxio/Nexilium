name: iOS IPA Build

on:
  push:
    branches:
      - main
      - "ui/**"
  pull_request:
  workflow_dispatch:

# Keep only the newest build for a branch; avoid piling up stale IPA builds.
concurrency:
  group: nexilium-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 40
    runs-on: macos-15-intel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Normalize app icon dimensions
        run: sips -z 1024 1024 Nexilium/Assets.xcassets/AppIcon.appiconset/AppIcon.png

      - name: Capture Xcode version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | awk 'NR==1 {print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode derived data
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('project.yml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-${{ steps.xcode-version.outputs.version }}-${{ hashFiles('project.yml') }}-

      - name: Resolve Swift packages
        timeout-minutes: 10
        run: xcodebuild -resolvePackageDependencies -project Nexilium.xcodeproj -scheme Nexilium -derivedDataPath build

      - name: Build for generic iOS device
        timeout-minutes: 30
        run: |
          xcodebuild \
            -project Nexilium.xcodeproj \
            -scheme Nexilium \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_BATCH_MODE=NO \
            SWIFT_COMPILATION_MODE=incremental \
            OTHER_SWIFT_FLAGS='$(inherited) -Xfrontend -warn-long-expression-type-checking=200 -Xfrontend -warn-long-function-bodies=500' \
            -showBuildTimingSummary \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p package/Payload
          cp -R build/Build/Products/Debug-iphoneos/Nexilium.app package/Payload/
          cd package
          zip -r ../Nexilium-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexilium-unsigned-IPA
          path: Nexilium-unsigned.ipa
          if-no-files-found: error
