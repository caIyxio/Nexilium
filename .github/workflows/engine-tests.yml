name: Engine Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  arm64-interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the JIT-free AArch64 interpreter
        run: |
          clang -O2 -std=gnu11 -D_GNU_SOURCE \
            -Wall -Wextra -Wno-unused-parameter \
            -I Engine -I Engine/Arm64 \
            Engine/NXMachine.c \
            Engine/NXHorizon.c \
            Engine/NXNSO.c \
            Engine/NXPFS0.c \
            Engine/NXCPU.c \
            Engine/Arm64/cpu.c \
            Engine/Arm64/decode.c \
            Engine/Arm64/exec_fpsimd.c \
            Engine/Arm64/sysreg.c \
            Engine/tests/engine_smoke.c \
            -lm -latomic -o engine-smoke
      - name: Run CPU interpreter smoke test
        run: ./engine-smoke
      - name: Compile engine format and memory regression tests
        run: |
          clang -O2 -std=gnu11 -D_GNU_SOURCE \
            -Wall -Wextra -Wno-unused-parameter \
            -I Engine -I Engine/Arm64 \
            Engine/NXMachine.c \
            Engine/NXHorizon.c \
            Engine/NXNSO.c \
            Engine/NXPFS0.c \
            Engine/NXCPU.c \
            Engine/Arm64/cpu.c \
            Engine/Arm64/decode.c \
            Engine/Arm64/exec_fpsimd.c \
            Engine/Arm64/sysreg.c \
            Engine/tests/engine_format_tests.c \
            -lm -latomic -o engine-format-tests
      - name: Run PFS0 and guest-memory regression tests
        run: ./engine-format-tests

      - name: Compile read-only RomFS parser tests
        run: |
          clang -O2 -std=gnu11 -D_GNU_SOURCE \
            -Wall -Wextra -Wno-unused-parameter \
            -I Engine \
            Engine/NXRomFS.c \
            Engine/tests/romfs_tests.c \
            -o romfs-tests
      - name: Run RomFS regression tests
        run: ./romfs-tests

      - name: Compile IVFC and RomFS integration tests
        run: |
          clang -O2 -std=gnu11 -D_GNU_SOURCE \
            -Wall -Wextra -Wno-unused-parameter \
            -I Engine \
            Engine/NXIVFC.c \
            Engine/NXRomFS.c \
            Engine/tests/ivfc_romfs_tests.c \
            -o ivfc-romfs-tests
      - name: Run IVFC and RomFS integration tests
        run: ./ivfc-romfs-tests

      - name: Compile NCA section table tests
        run: |
          clang -O2 -std=gnu11 -D_GNU_SOURCE \
            -Wall -Wextra -Wno-unused-parameter \
            -I Engine \
            Engine/NXNCA.c \
            Engine/tests/nca_section_tests.c \
            -o nca-section-tests
      - name: Run NCA section table tests
        run: ./nca-section-tests

      - name: Compile NCA-to-RomFS pipeline tests
        run: |
          clang -O2 -std=gnu11 -D_GNU_SOURCE \
            -Wall -Wextra -Wno-unused-parameter \
            -I Engine \
            Engine/NXNCA.c \
            Engine/NXIVFC.c \
            Engine/NXRomFS.c \
            Engine/tests/nca_ivfc_romfs_pipeline_tests.c \
            -o nca-romfs-pipeline-tests
      - name: Run NCA-to-RomFS pipeline tests
        run: ./nca-romfs-pipeline-tests

      - name: Compile NPDM metadata validation tests
        run: |
          clang -O2 -std=gnu11 -D_GNU_SOURCE \
            -Wall -Wextra -Wno-unused-parameter \
            -I Engine \
            Engine/NXNPDM.c \
            Engine/tests/npdm_tests.c \
            -o npdm-tests
      - name: Run NPDM metadata validation tests
        run: ./npdm-tests
