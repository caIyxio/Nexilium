name: Nexilium
options:
  bundleIdPrefix: com.siliconteam
  deploymentTarget:
    iOS: "18.0"
packages:
  AppEntitlements:
    url: https://github.com/wiedem/app-entitlements.git
    from: 2.0.0
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
targets:
  Nexilium:
    type: application
    platform: iOS
    sources:
      - path: Nexilium
      - path: Engine
        excludes:
          - tests/**
    dependencies:
      - package: AppEntitlements
        product: AppEntitlements
      - package: ZIPFoundation
        product: ZIPFoundation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.siliconteam.nexilium
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_OBJC_BRIDGING_HEADER: Nexilium/Nexilium-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
